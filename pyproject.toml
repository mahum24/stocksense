[project]
name = "stocksense"
version = "0.1.0"
description = "Demand forecasting and smart reordering for a wholesale distributor"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["stocksense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]
